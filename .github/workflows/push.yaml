name: JS Frontend CI - Lint, Build & Push

on:
  push:
    branches:
      - main

jobs: 
  lint:
     name: ESLint JavaScript Check
     runs-on: ubuntu-latest
     steps:
       - name: Checkout repository
         uses: actions/checkout@v4
       
       - name: Setup Node.js
         uses: actions/setup-node@v4
         with: 
         node-version: '20'

       - name: Install dependencies and lint JS
         run: |
           npm install
           npm run lint

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
       - name: Checkout repository
         uses: actions/checkout@v4

       - name: Setup Docker Buildx
         uses: docker/setup-buildx-action@v3
       
       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with: 
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Build and Push Docker Image
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: |
             ${{ secrets.DOCKERHUB_USERNAME }}/js-frontend-ci-practice:latest
           ${{ secrets.DOCKERHUB_USERNAME }}/js-frontend-ci-practice:{{ github.sha }}



    
